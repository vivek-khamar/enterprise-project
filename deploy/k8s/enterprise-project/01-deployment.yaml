apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-project
  namespace: enterprise-dev
  labels:
    app: enterprise-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-project
  template:
    metadata:
      labels:
        app: enterprise-project
    spec:
      containers:
        - name: enterprise-project
          image: enterprise/enterprise-project:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: enterprise-project-config
          livenessProbe:
            httpGet:
              path: /enterprise/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /enterprise/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
