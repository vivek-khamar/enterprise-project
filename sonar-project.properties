# SonarCloud / SonarQube project configuration
# https://docs.sonarcloud.io/advanced-setup/ci-based-analysis/sonarscanner-for-maven/
#
# ── Quick-start ───────────────────────────────────────────────────────────────
# 1. Create a project at https://sonarcloud.io
# 2. Set the SONAR_TOKEN secret in GitHub → Settings → Secrets → Actions
# 3. Set SONAR_PROJECT_KEY and SONAR_ORGANIZATION as Actions Variables (not secrets)
# 4. Push a commit — the CI workflow will run the analysis automatically
#
# ── Self-hosted SonarQube ─────────────────────────────────────────────────────
# Change sonar.host.url to your SonarQube server URL and update the CI step.

# ── Identification ─────────────────────────────────────────────────────────────
# Replace with your actual SonarCloud organisation and project key.
# These values must also be set as GitHub Actions Variables (SONAR_PROJECT_KEY,
# SONAR_ORGANIZATION) so the CI step can read them.
sonar.projectKey=vivek-khamar_enterprise-project
sonar.projectName=Enterprise Project
sonar.projectVersion=0.0.1-SNAPSHOT

# ── Source layout ──────────────────────────────────────────────────────────────
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=25
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar

# ── Coverage ───────────────────────────────────────────────────────────────────
# JaCoCo XML report generated by `mvn verify` (jacoco:report goal).
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# ── Exclusions (aligned with JaCoCo pom.xml exclusions) ───────────────────────
# These packages are excluded from both coverage and duplication checks so the
# reported metrics reflect only business-logic code.
sonar.exclusions=\
  src/main/java/com/enterprise/demo/EnterpriseProjectApplication.java,\
  src/main/java/com/enterprise/demo/config/**/*,\
  src/main/java/com/enterprise/demo/event/**/*,\
  src/main/java/com/enterprise/demo/security/**/*,\
  src/main/java/com/enterprise/demo/util/**/*

sonar.coverage.exclusions=\
  src/main/java/com/enterprise/demo/EnterpriseProjectApplication.java,\
  src/main/java/com/enterprise/demo/config/**/*,\
  src/main/java/com/enterprise/demo/event/**/*,\
  src/main/java/com/enterprise/demo/security/**/*,\
  src/main/java/com/enterprise/demo/util/**/*

# DTOs are simple data holders — duplication in them is expected and acceptable.
sonar.cpd.exclusions=\
  src/main/java/com/enterprise/demo/dto/**/*

# ── Quality gate (SonarCloud default "Sonar way") ─────────────────────────────
# The CI workflow uses -Dsonar.qualitygate.wait=true which causes the build to
# fail if this quality gate is not met.
#
# Recommended custom quality-gate settings (configure in SonarCloud UI):
#   Coverage on new code             ≥ 80 %
#   Duplicated lines on new code     ≤ 3 %
#   Maintainability rating           ≥ A
#   Reliability rating               ≥ A
#   Security rating                  ≥ A
#   Security hotspots reviewed       = 100 %
